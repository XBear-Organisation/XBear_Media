<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="XBear Media — Markalarımız. Konya." />
    <title>Markalarımız — XBear Media</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="page-brands">
    <a class="skip-link" href="#markalar">Markalara geç</a>
    <div class="grain" aria-hidden="true"></div>

    <header class="nav is-solid" id="nav">
      <a class="nav-brand" href="/" aria-label="XBear Media">
        <img src="/assets/images/logo.png" alt="XBear Media" class="nav-logo" />
      </a>
      <nav class="nav-links" aria-label="Menü">
        <a href="/#isler">İşler</a>
        <a href="/markalar.html" aria-current="page">Markalarımız</a>
        <a href="/#iletisim">İletişim</a>
      </nav>
    </header>

    <main id="markalar" class="brands">
      <p class="credit">Portfolyo</p>
      <h1>Markalarımız</h1>
      <p class="brands-lede">Çalıştığımız isimler. Logo, fotoğraf ve metin yerleri hazır; içerik sonra eklenecek.</p>

      <div class="brand-grid">
        <button type="button" class="brand" data-brand="mackbear">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Mackbear</span>
        </button>
        <button type="button" class="brand" data-brand="mypoint">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">MYPOINT</span>
        </button>
        <button type="button" class="brand" data-brand="extrablatt">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Extrablatt</span>
        </button>
        <button type="button" class="brand" data-brand="lafinkas">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">LaFinkas</span>
        </button>
        <button type="button" class="brand" data-brand="lupen">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Lupen</span>
        </button>
        <button type="button" class="brand" data-brand="blok3">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">BLOK3</span>
        </button>
        <div class="brand is-wait">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Yeni marka</span>
        </div>
        <div class="brand is-wait">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Yeni marka</span>
        </div>
        <div class="brand is-wait">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Yeni marka</span>
        </div>
        <div class="brand is-wait">
          <span class="brand-slot"><span class="brand-ph">Logo</span></span>
          <span class="brand-name">Yeni marka</span>
        </div>
      </div>
    </main>

    <footer class="foot">
      <a href="#">XBear Event</a>
    </footer>

    <div class="brand-pop" id="brandPop" hidden>
      <div class="brand-pop-veil" data-brand-close></div>
      <article class="brand-pop-card" id="brandCard">
        <button type="button" class="lite-x" data-brand-close aria-label="Kapat">×</button>
        <div class="brand-pop-media">
          <img data-brand-photo alt="" hidden />
          <div class="brand-ph brand-ph--photo" data-brand-photo-ph>
            <span>Fotoğraf</span>
            <small>Marka görseli buraya</small>
          </div>
        </div>
        <div class="brand-pop-copy">
          <p class="credit" data-brand-tag></p>
          <h2 data-brand-name></h2>
          <div class="brand-field">
            <p class="brand-field-label">Açıklama</p>
            <p data-brand-info></p>
          </div>
          <div class="brand-field">
            <p class="brand-field-label">Hakkında</p>
            <p data-brand-about></p>
          </div>
          <a class="brand-work" data-brand-work href="/#isler">İşleri gör</a>
        </div>
      </article>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
